[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaforge"
version = "0.1.0"
description = "A verifiable natural-language quantum experiment agent for Biren GPU"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "unitarylab==1.0.0",
  "unitarylab-algorithms>=1.1.0,<2",
]

[project.scripts]
quantaforge = "quantaforge.cli:main"
quantaforge-web = "quantaforge.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

